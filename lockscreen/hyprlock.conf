# Vorlage für den Alpe-Sperrbildschirm (Format von hyprlock).
#
# tools/lockscreen.sh setzt diese Datei mit tools/hyprlock2qml.py in den KDE-Sperrbildschirm um;
# unter Hyprland nimmt die Shell-Sperre denselben Aufbau. Eine eigene Fassung unter
# ~/.config/alpe/hyprlock.conf hat Vorrang. Am bequemsten gestaltet man in den Einstellungen
# (Sicherheit → Sperrbildschirm gestalten): Texte, Bilder, Passwortfeld, Hintergrund.
#
# Masse in Pixeln eines Bildschirms von 2560 × 1664 (MacBook Air); umgesetzt wird auf jeden
# Bildschirm (Höhe bzw. Breite, was knapper ist). «monitor» wird nicht beachtet.
# Den Hintergrund nimmt Alpe vom Desktop (Einstellung lockFollowWallpaper).
#
# Stunden und Minuten gross übereinander in Alfa Slab One, darunter Datum und Passwortfeld.
# Die Schriften liefert Alpe mit (Modules/Lock/Alpe/fonts, SIL Open Font License).

# GENERAL
general {
  grace = 1
  ignore_empty_input = true
  text_trim = true
}

# BACKGROUND
background {
    monitor = eDP-1
    blur_passes = 3
    blur_size = 7
    contrast = 0.8916
    brightness = 0.7172
    vibrancy = 0.1696
    vibrancy_darkness = 0
}

# TIME HR
label {
    monitor =
    text = cmd[update:1000] date +"%H"
    # Mac: color = rgba(255, 255, 255, 0.9)
    color = rgba(255, 255, 255, 0.75)
    shadow_size = 3
    shadow_color = rgb(0,0,0)
    shadow_boost = 1.2
    font_size = 150
    font_family = AlfaSlabOne
    position = 0, -350
    halign = center
    valign = top
    zindex = 5
}

# TIME
label {
    monitor = eDP-1
    text = cmd[update:1000] date +"%M"
    # Mac: color = rgba(255, 255, 255, 1)
    color = rgba(255, 255, 255, 0.75)
    font_size = 150
    font_family = AlfaSlabOne
    position = 0, -520
    halign = center
    valign = top
    zindex = 5
}

# DATE
label {
    monitor = eDP-1
    text = cmd[update:1000] echo "$(date +'%A, %d. %B')"
    color = rgba(255, 255, 255, 1)
    font_size = 24
    # Mac: font_family = JetBrains Mono Nerd Font Mono ExtraBold
    font_family = JetBrains Mono Nerd Font Mono
    position = 0, 20
    halign = center
    valign = center
    zindex = 5
}

# INPUT FIELD
input-field {
    monitor = eDP-1
    size = 200, 50
    outline_thickness = 1
    outer_color = rgba(255, 255, 255, 0)
    dots_size = 0.1 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 1 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    inner_color = rgba(255, 255, 255, 0.1)
    font_color = rgb(200, 200, 200)
    fade_on_empty = false
    # Mac: placeholder_text = <i>Passwort...</i>
    placeholder_text = Passwort...
    hide_input = false
    position = 0, -40
    halign = center
    valign = center
    zindex = 20
}
