# Beispiel für die Tests: sechs Bilder, drei Texte, Passwortfeld (Bildpfade erfunden).

# GENERAL
general {
  grace = 1
  ignore_empty_input = true
  text_trim = true
}

# BACKGROUND
background {
    monitor = eDP-1
    path = /home/nutzer/Bilder/Sperre/hintergrund.jpg
    blur_passes = 3
    blur_size = 7
    contrast = 0.8916
    brightness = 0.7172
    vibrancy = 0.1696
    vibrancy_darkness = 0
}

image {
    monitor = eDP-1
    path = /home/nutzer/Bilder/Sperre/logo.png
    size = 350
    rounding = -1
    border_size = 0
    border_color = rgba(255, 255, 255, 0.4)
