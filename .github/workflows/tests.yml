# Alpe: Bei jedem Push alle Tests laufen lassen (Shell-Code in shell/, Dienst in core/).
name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Python-Abhängigkeiten
        run: |
          pip install h5py numpy PySide6-Essentials
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 >/dev/null

      - name: Tests (wie lokal mit «alpe test»)
        env:
          QT_QPA_PLATFORM: offscreen
          ALPE_SKIP_GO: "1"   # der Go-Teil läuft unten im eigenen Schritt
        run: bash tools/test.sh

      - name: Dienst (Go) bauen und testen
        uses: actions/setup-go@v6
        with:
          go-version-file: core/go.mod
          cache: false

      # Im Go-Schritt ohne ALPE_SKIP_GO: der Teil von tests/test_makefile.py, der baut, installiert und das
      # Quellarchiv prüft (oben übersprungen, Plan 0.8 Nr. 124).
      - name: Go-Tests der Alpe-Änderungen, Makefile (Bau, Installation, Quellarchiv)
        run: |
          (cd core && go test ./internal/server -run 'TestReadAlpeOff' -count=1)
          python3 tests/test_makefile.py
