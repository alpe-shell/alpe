# Alpe: Bei jedem Push alle Tests laufen lassen (Shell-Code in shell/, Dienst in core/).
name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Python-Abhängigkeiten
        run: |
          pip install h5py numpy PySide6-Essentials
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 >/dev/null

      - name: Tests (wie lokal mit «alpe test»)
        env:
          QT_QPA_PLATFORM: offscreen
          ALPE_SKIP_GO: "1"   # der Go-Teil läuft unten im eigenen Schritt
        run: bash tools/test.sh

      - name: Dienst (Go) bauen und testen
        uses: actions/setup-go@v6
        with:
          go-version-file: core/go.mod
          cache: false

      # Im Go-Schritt ohne ALPE_SKIP_GO: der Teil von tests/test_makefile.py, der baut, installiert und das
      # Quellarchiv prüft (oben übersprungen, Plan 0.8 Nr. 124).
      - name: Go-Tests der Alpe-Änderungen, Makefile (Bau, Installation, Quellarchiv)
        run: |
          (cd core && go test ./internal/server -run 'TestReadAlpeOff' -count=1)
          (cd core && go test -count=1 ./internal/pam ./internal/clipolicy)   # wie tools/test.sh (Plan 0.8 Nr. 136)
          python3 tests/test_makefile.py

  # Plan 9 und 0.8 Nr. 127: das PKGBUILD in archlinux:latest bauen, aus dem Archiv von make dist, mit makepkg und namcap.
  # makepkg läuft nie als root; kora-icon-theme kommt aus dem AUR (nicht in den Paketquellen, Plan 6.2).
  arch-paket:
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 45
    # Das Token darf nur lesen und liegt nicht im Arbeitsbaum (persist-credentials: false) – im Job läuft fremder
    # Code aus dem AUR (kora-icon-theme) unter dem Benutzer, dem der Arbeitsbaum gehört.
    permissions:
      contents: read
    steps:
      - name: Werkzeuge und Benutzer für makepkg
        run: |
          pacman -Syu --noconfirm --needed base-devel git go namcap sudo
          useradd -m bauer
          echo 'bauer ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/bauer

      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Quellarchiv (make dist)
        run: |
          chown -R bauer: "$GITHUB_WORKSPACE"
          sudo -u bauer git config --global --add safe.directory "$GITHUB_WORKSPACE"
          sudo -u bauer make dist BUILD=/tmp/alpe-dist

      - name: kora-icon-theme aus dem AUR
        run: |
          sudo -u bauer git clone --depth 1 https://aur.archlinux.org/kora-icon-theme.git /tmp/kora
          cd /tmp/kora
          sudo -u bauer makepkg -si --noconfirm

      - name: Paket bauen (makepkg -s, mit check)
        run: |
          mkdir /tmp/paket
          cp packaging/arch/PKGBUILD /tmp/alpe-dist/alpe-shell-*.tar.gz /tmp/paket/
          chown -R bauer: /tmp/paket
          cd /tmp/paket
          sudo -u bauer makepkg -s --noconfirm

      - name: namcap
        run: |
          cd /tmp/paket
          namcap PKGBUILD
          namcap alpe-shell-*.pkg.tar.zst

      - name: Dateiliste des Pakets
        run: pacman -Qlp /tmp/paket/alpe-shell-*.pkg.tar.zst
