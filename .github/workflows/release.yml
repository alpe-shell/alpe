# Alpe: Beim Schieben eines Versions-Tags (etwa «git tag v1.1 && git push origin v1.1»)
# das Archiv alpe-zugerberg-<version>.tar.gz bauen und als Release anhängen.
# Gibt es den Release schon (Tag erneut geschoben, Lauf wiederholt), wird das Archiv ersetzt
# und der Text nachgeführt, statt abzubrechen.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  archiv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: alpe

      - name: Tag, Brand.qml und CHANGELOG.md stimmen überein
        run: bash alpe/tools/release-pruefen.sh "$GITHUB_REF_NAME"

      - name: Archiv bauen
        run: |
          v="${GITHUB_REF_NAME#v}"
          tar czf "alpe-zugerberg-$v.tar.gz" --exclude=.git --exclude='__pycache__' alpe
          echo "ARCHIV=alpe-zugerberg-$v.tar.gz" >> "$GITHUB_ENV"

      - name: Release anlegen oder nachführen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="$(awk '/^## /{n++} n==1' alpe/CHANGELOG.md)"
          title="Alpe ${GITHUB_REF_NAME#v} «Zugerberg»"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$ARCHIV" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "$title" --notes "${notes:-siehe CHANGELOG.md}"
          else
            gh release create "$GITHUB_REF_NAME" "$ARCHIV" --repo "$GITHUB_REPOSITORY" \
              --title "$title" --notes "${notes:-siehe CHANGELOG.md}"
          fi
